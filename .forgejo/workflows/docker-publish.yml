name: Build and Publish Docker Image to Forgejo Packages

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

env:
  REGISTRY: source.shadowfenix.net
  IMAGE_NAME: development/clord

jobs:
  publish:
    name: Build & Push Docker Image with Kaniko
    runs-on: linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and push with Kaniko
        uses: aevea/action-kaniko@master
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.FORGEJO_TOKEN || secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          tag_with_latest: true
          build_file: Dockerfile
          path: .
